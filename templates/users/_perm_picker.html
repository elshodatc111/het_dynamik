{# perm_groups: [(bo‘lim, [(kod, nomi, belgilangan)])]; name — input nomi #}
<div class="perm-groups">
{% for title, items in perm_groups %}
  <fieldset class="perm-group" x-data="{ all: false, toggle(e) { e.target.closest('fieldset').querySelectorAll('input[type=checkbox][name={{ name }}]').forEach(c => c.checked = e.target.checked) } }">
    <legend><label class="check"><input type="checkbox" @change="toggle($event)"> <b>{{ title }}</b></label></legend>
    {% for code, label, on in items %}
      <label class="check"><input type="checkbox" name="{{ name }}" value="{{ code }}" {% if on %}checked{% endif %}><span>{{ label }}</span></label>
    {% endfor %}
  </fieldset>
{% endfor %}
</div>
